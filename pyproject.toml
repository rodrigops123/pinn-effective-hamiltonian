[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn-effective-hamiltonian"
version = "0.1.0"
description = "Physics-informed neural networks for the state evolution and effective Hamiltonian of the Jaynes-Cummings model"
readme = "README.md"
requires-python = ">=3.12"
# Compatible ranges; exact versions (with hashes) are pinned in uv.lock.
dependencies = [
    "torch~=2.7.0",
    "qutip~=5.0.4",
    "numpy~=2.0.2",
    "scipy~=1.13.1",
    "matplotlib~=3.9.4",
    "SciencePlots~=2.1.1",
    "tqdm~=4.67.1",
    "pyyaml~=6.0",
]

[dependency-groups]
dev = [
    "pytest~=8.3.5",
    "ruff==0.17.3",  # keep in sync with the ruff-pre-commit rev
    "pre-commit~=4.7.0",
    "nbstripout~=0.9.1",
]
notebooks = ["ipykernel~=6.29.5"]

[tool.uv]
required-version = ">=0.6.14"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::FutureWarning:qutip",
    # matplotlib 3.9 calls pyparsing APIs that newer pyparsing releases deprecate
    "ignore::pyparsing.warnings.PyparsingDeprecationWarning",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests", "scripts"]
# The introductory example is kept verbatim.
extend-exclude = ["examples/*.ipynb"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "D"]
# E501: line length is the formatter's job; D105/D107: magic methods and __init__
# are documented on their class.
ignore = ["E501", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"scripts/*" = ["D103"]
"*.ipynb" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["pinn_jc"]
