[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn-effective-hamiltonian"
version = "0.1.0"
description = "Physics-informed neural networks for the state evolution and effective Hamiltonian of the Jaynes-Cummings model"
requires-python = ">=3.9"
# Pinned to the versions that produced the current results.
dependencies = [
    "torch==2.7.0",
    "qutip==5.0.4",
    "numpy==2.0.2",
    "scipy==1.13.1",
    "matplotlib==3.9.4",
    "SciencePlots==2.1.1",
    "tqdm==4.67.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

# Phase 0 only declares dependencies; the code becomes an installable package in Phase 1.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::FutureWarning:qutip",
    "ignore:Dedicated options class are no longer needed:FutureWarning",
]
