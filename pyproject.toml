[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn-effective-hamiltonian"
version = "0.1.0"
description = "Physics-informed neural networks for the state evolution and effective Hamiltonian of the Jaynes-Cummings model"
requires-python = ">=3.12"
# Pinned to the versions that produced the current results.
dependencies = [
    "torch==2.7.0",
    "qutip==5.0.4",
    "numpy==2.0.2",
    "scipy==1.13.1",
    "matplotlib==3.9.4",
    "SciencePlots==2.1.1",
    "tqdm==4.67.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "ruff==0.17.3",
    "pre-commit==4.7.0",
    "nbstripout==0.9.1",
]
notebooks = ["ipykernel==6.29.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::FutureWarning:qutip",
    "ignore:Dedicated options class are no longer needed:FutureWarning",
    # matplotlib 3.9 calls pyparsing APIs that newer pyparsing releases deprecate
    "ignore::DeprecationWarning:matplotlib\\..*",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests", "scripts"]
# Notebooks are rewritten as thin wrappers in Phase 6; lint them from then on.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is the formatter's job

[tool.ruff.lint.isort]
known-first-party = ["pinn_jc"]
