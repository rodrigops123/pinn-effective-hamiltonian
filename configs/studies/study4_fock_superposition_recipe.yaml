# Does the recipe that fixes atom_coherent (docs/studies/coherent_squeeze.md) also suit
# atom_fock_superposition (configs/atom_fock_superposition.yaml)? Variant 'recipe': The atom_coherent recipe: excitation truncation, ODE loss averaged over components, learning rate 1e-3.
experiment:
  name: study4_fock_superposition_recipe
  description: 'atom_fock_superposition with the atom_coherent recipe check. The atom_coherent
    recipe: excitation truncation, ODE loss averaged over components, learning rate
    1e-3.'
  seeds:
  - 42
  - 43
  - 44
  - 45
physics:
  picture: atom
  params:
    wc: 1.0
    wa: 1.0
    g1: 1.0
  init_state: fock_superposition
  dims:
    atom: 2
    field: 3
  truncation: excitation
data:
  tfinal: 6.283185307179586
  n_time_steps: 200
  n_data_points: 200
model:
  hidden_units:
  - 100
  - 100
  - 100
  activation: sine
training:
  epochs: 30000
  learning_rate: 0.001
  ode_reduction: mean
