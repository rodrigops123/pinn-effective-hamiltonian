# Does the loss balance and learning rate of the atom_* recipe (docs/studies/coherent_squeeze.md)
# also suit rabi2_g_equals_omega_fock (configs/rabi2_g_equals_omega_fock.yaml)? Variant 'recipe': ODE loss averaged over components and learning rate 1e-3 (the excitation truncation does not apply to rabi2_ip).
experiment:
  name: study5_rabi2_g_equals_omega_fock_recipe
  description: rabi2_g_equals_omega_fock with the atom_* recipe check. ODE loss averaged
    over components and learning rate 1e-3 (the excitation truncation does not apply
    to rabi2_ip).
  seeds:
  - 42
  - 43
  - 44
  - 45
physics:
  picture: rabi2_ip
  params:
    wc: 1.0
    wa: 1.0
    g1: 1.0
    g2: 1.0
  init_state: fock
  dims:
    atom: 2
    field: 4
  positivity: softplus
data:
  tfinal: 6.283185307179586
  n_time_steps: 400
  n_data_points: 400
model:
  hidden_units:
  - 100
  - 100
  - 100
  activation: sine
training:
  epochs: 30000
  learning_rate: 0.001
  ode_reduction: mean
