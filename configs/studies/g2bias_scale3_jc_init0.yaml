# g2-bias study, step 2: the ω = 5 recipe control
# (configs/reproduction/control_jc_data_w5_recipe.yaml)
# with the network input scaled to 3t and g2 started near 0, on five seeds.
experiment:
  name: g2bias_scale3_jc_init0
  description: JC data (true g2 = 0) at ω = 5, network input 3t, g2 starts at 0.05.
  seeds: [100, 101, 102, 103, 104]
physics:
  picture: rabi2_ip
  params: {wc: 5.0, wa: 5.0, g1: 1.0, g2: 0.0}
  init_state: fock
  dims: {atom: 2, field: 6}
  positivity: softplus
  coupling_init: {g2: 0.05}
data:
  tfinal: 6.283185307179586  # 2π
  n_time_steps: 500
  n_data_points: 500
model:
  hidden_units: [100, 100, 100]
  activation: sine
  input_scale: 3.0
training:
  epochs: 50000
  learning_rate: 0.001
  ode_reduction: mean
