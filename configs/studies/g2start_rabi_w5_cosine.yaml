# g2-start study (docs/studies/g2_start.md): configs/rwa_sweep/rwa_rabi_w5.yaml with g2
# started at 0.05 instead of near 1 (g1 from the softplus draw as before). The learning rate
# decays from 1e-3 to 1e-5 (cosine).
experiment:
  name: g2start_rabi_w5_cosine
  description: Rabi data at g/ω = 0.2, learn g1 and g2 with the Rabi model, g2 started at 0.05, cosine.
  seeds: [100, 101, 102, 103, 104]
physics:
  picture: rabi2_ip
  params: {wc: 5, wa: 5, g1: 1.0, g2: 1}
  init_state: fock
  dims: {atom: 2, field: 6}
  positivity: abs
  coupling_draw: softplus
  coupling_init: {g2: 0.05}
data:
  tfinal: 6.283185307179586  # 2π
  n_time_steps: 500
  n_data_points: 500
model:
  hidden_units: [100, 100, 100]
  activation: sine
  input_scale: 10.0
training:
  epochs: 50000
  learning_rate: 0.001
  lr_schedule: cosine
  final_learning_rate: 1.0e-5
  ode_reduction: mean
