# Study of why atom_coherent fails to recover g1 (configs/atom_coherent.yaml), round 2.
# Variant 'trunc_icD_lr1e-3': Excitation truncation, initial-condition weight D/4, learning rate 1e-3. Every variant uses the same seeds.
experiment:
  name: study2_coherent_trunc_icD_lr1e-3
  description: atom_coherent study, round 2. Excitation truncation, initial-condition
    weight D/4, learning rate 1e-3.
  seeds:
  - 42
  - 43
  - 44
  - 45
physics:
  picture: atom
  params:
    wc: 1.0
    wa: 1.0
    g1: 1.0
  init_state: coherent
  init_state_options:
    alpha: 1.0
  dims:
    atom: 2
    field: 10
  truncation: excitation
data:
  tfinal: 6.283185307179586
  n_time_steps: 500
  n_data_points: 500
model:
  hidden_units:
  - 100
  - 100
  - 100
  activation: sine
training:
  epochs: 50000
  learning_rate: 0.001
  loss_weights:
    ic: 4.75
