# Measurement-noise study (docs/studies/measurement_noise.md): configs/rwa_sweep/rwa_rabi_w100.yaml
# with Gaussian noise of standard deviation 0.01 on the fitted expectation values
# (about 2500 shots per point), the same realisation for every seed.
experiment:
  name: noise_rabi_w100
  description: Rabi data at g/ω = 0.01, learn g1 and g2 with the Rabi model, noise 0.01.
  seeds: [100, 101, 102, 103, 104]
physics:
  picture: rabi2_ip
  params: {wc: 100, wa: 100, g1: 1.0, g2: 1}
  init_state: fock
  dims: {atom: 2, field: 3}
  positivity: abs
  coupling_draw: softplus
data:
  tfinal: 6.283185307179586  # 2π
  n_time_steps: 2001
  n_data_points: 2001
  noise_std: 0.01
  noise_seed: 0
model:
  hidden_units: [100, 100, 100]
  activation: sine
  input_scale: 10.0
training:
  epochs: 50000
  learning_rate: 0.001
  ode_reduction: mean
