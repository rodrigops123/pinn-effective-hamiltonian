# Noise sweep: configs/final/final_rabi_w15_init005.yaml with Gaussian measurement noise of standard
# deviation 0.01 (docs/studies/measurement_noise.md), noise seed 0. Noise seeds 1, 2
# only at the switch (ω = 10, 15), to check that one noise draw does not decide g2.
experiment:
  name: final_noise_rabi_w15_init005
  description: Rabi data at g/ω ≈ 0.067, learn g1 and g2 with the Rabi model, g2 started at 0.05, 150k epochs, noise 0.01 (noise seed 0).
  seeds: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109]
physics:
  picture: rabi2_ip
  params: {wc: 15, wa: 15, g1: 1.0, g2: 1}
  init_state: fock
  dims: {atom: 2, field: 4}
  positivity: abs
  coupling_draw: softplus
  coupling_init: {g2: 0.05}
data:
  tfinal: 6.283185307179586  # 2π
  n_time_steps: 500
  n_data_points: 500
  noise_std: 0.01
  noise_seed: 0
model:
  hidden_units: [100, 100, 100]
  activation: sine
  input_scale: 10.0
training:
  epochs: 150000
  learning_rate: 0.001
  ode_reduction: mean
