# As atom_fock, from |g> ⊗ |α = 1>, field truncated at 10 photons.
experiment:
  name: atom_coherent
  description: Learn g1 and the state from a coherent field (α = 1), rotating frame, on resonance.
  seeds: [42, 43]
physics:
  picture: atom
  params: {wc: 1.0, wa: 1.0, g1: 1.0}
  init_state: coherent
  init_state_options: {alpha: 1.0}
  dims: {atom: 2, field: 10}
data:
  tfinal: 6.283185307179586  # 2π
  n_time_steps: 500
  n_data_points: 500
model:
  hidden_units: [100, 100, 100]
  activation: sine
training:
  epochs: 50000
  learning_rate: 0.01
