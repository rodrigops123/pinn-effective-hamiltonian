# Full Rabi model at g1 = g2 = ωc = ωa = 1 (g/ω = 1, the onset of deep strong coupling),
# learned in the interaction picture.
experiment:
  name: rabi2_g_equals_omega_fock
  description: Learn g1 and g2 of the full Rabi model at g/ω = 1, interaction picture.
  seeds: [42, 43]
physics:
  picture: rabi2_ip
  params: {wc: 1.0, wa: 1.0, g1: 1.0, g2: 1.0}
  init_state: fock
  dims: {atom: 2, field: 4}
  positivity: softplus
data:
  tfinal: 6.283185307179586  # 2π
  n_time_steps: 400
  n_data_points: 400
model:
  hidden_units: [100, 100, 100]
  activation: sine
training:
  epochs: 30000
  learning_rate: 0.01
