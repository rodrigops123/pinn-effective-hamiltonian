# Final sweep (Phase E, docs/studies/final_sweep.md): configs/rwa_sweep/rwa_jc_w100.yaml
# with 10 seeds, 50k epochs and g2 started at 0.05 (the second start).
# Per seed, the start with the lower total loss is kept (docs/studies/g2_start.md).
experiment:
  name: final_jc_w100_init005
  description: JC data at g/ω = 0.01, learn g1 and g2 with the Rabi model, g2 started at 0.05, 50k epochs.
  seeds: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109]
physics:
  picture: rabi2_ip
  params: {wc: 100, wa: 100, g1: 1.0, g2: 0}
  init_state: fock
  dims: {atom: 2, field: 3}
  positivity: abs
  coupling_draw: softplus
  coupling_init: {g2: 0.05}
data:
  tfinal: 6.283185307179586  # 2π
  n_time_steps: 2001
  n_data_points: 2001
model:
  hidden_units: [100, 100, 100]
  activation: sine
  input_scale: 10.0
training:
  epochs: 50000
  learning_rate: 0.001
  ode_reduction: mean
