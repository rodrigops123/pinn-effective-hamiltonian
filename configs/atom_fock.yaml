# Jaynes-Cummings on resonance, learned in the frame rotating at ωa: learn g1 and the
# state from |e,0>.
experiment:
  name: atom_fock
  description: Learn the JC coupling g1 and the state from |e,0>, rotating frame, on resonance.
  seeds: [42, 43]
physics:
  picture: atom
  params: {wc: 1.0, wa: 1.0, g1: 1.0}
  init_state: fock
  dims: {atom: 2, field: 2}
data:
  tfinal: 6.283185307179586  # 2π
  n_time_steps: 200
  n_data_points: 200
model:
  hidden_units: [100, 100, 100]
  activation: sine
training:
  epochs: 30000
  learning_rate: 0.01
