# RWA sweep (docs/studies/rwa_sweep.md): Rabi data (g1 = 1, g2 = 1) at ωc = ωa = 1,
# g/ω = 1, learned with the Rabi model in its interaction picture, g2 started near 1
# (full model). Field dimension 18 reproduces the observables of a 40-level field
# to 1e-4; 500 time steps give 250 points per period of the
# counter-rotating terms (frequency 2ω). Settings of docs/studies/positivity_benchmark.md.
experiment:
  name: rwa_rabi_w1
  description: Rabi data at g/ω = 1, learn g1 and g2 with the Rabi model.
  seeds: [100, 101, 102, 103, 104]
physics:
  picture: rabi2_ip
  params: {wc: 1, wa: 1, g1: 1.0, g2: 1}
  init_state: fock
  dims: {atom: 2, field: 18}
  positivity: abs
  coupling_draw: softplus
data:
  tfinal: 6.283185307179586  # 2π
  n_time_steps: 500
  n_data_points: 500
model:
  hidden_units: [100, 100, 100]
  activation: sine
  input_scale: 10.0
training:
  epochs: 50000
  learning_rate: 0.001
  ode_reduction: mean
