# As atom_fock, from |g> ⊗ S(r = 1)|0>, field truncated at 15 photons.
experiment:
  name: atom_squeeze
  description: Learn g1 and the state from a squeezed vacuum (r = 1), rotating frame, on resonance.
  seeds: [42, 43]
physics:
  picture: atom
  params: {wc: 1.0, wa: 1.0, g1: 1.0}
  init_state: squeeze
  init_state_options: {r: 1.0}
  dims: {atom: 2, field: 15}
data:
  tfinal: 6.283185307179586  # 2π
  n_time_steps: 400
  n_data_points: 400
model:
  hidden_units: [100, 100, 100]
  activation: sine
training:
  epochs: 30000
  learning_rate: 0.01
