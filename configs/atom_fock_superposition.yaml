# As atom_fock, from |g> ⊗ (|0> + |1> + |2>)/√3.
# Excitation-number truncation, the ODE loss averaged over components and learning rate
# 1e-3, as in atom_coherent: on four seeds they give 5x smaller g1 errors than the
# previous settings (docs/studies/coherent_squeeze.md).
experiment:
  name: atom_fock_superposition
  description: Learn g1 and the state from a Fock superposition, rotating frame, on resonance.
  seeds: [42, 43]
physics:
  picture: atom
  params: {wc: 1.0, wa: 1.0, g1: 1.0}
  init_state: fock_superposition
  dims: {atom: 2, field: 3}
  truncation: excitation
data:
  tfinal: 6.283185307179586  # 2π
  n_time_steps: 200
  n_data_points: 200
model:
  hidden_units: [100, 100, 100]
  activation: sine
training:
  epochs: 30000
  learning_rate: 0.001
  ode_reduction: mean
