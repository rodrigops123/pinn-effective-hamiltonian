# Data from Jaynes-Cummings dynamics (true g2 = 0, ωc = ωa = 100 >> g1), learned with
# the full Rabi model in its interaction picture: does the PINN find g2 ≈ 0?
experiment:
  name: rabi2_jc_fock
  description: Learn g1 and the counter-rotating g2 (true 0) from JC data, interaction picture.
  seeds: [100, 101]
physics:
  picture: rabi2_ip
  params: {wc: 100.0, wa: 100.0, g1: 1.0, g2: 0.0}
  init_state: fock
  dims: {atom: 2, field: 2}
  positivity: softplus
data:
  tfinal: 25.132741228718345  # 8π
  n_time_steps: 500
  n_data_points: 500
model:
  hidden_units: [100, 100, 100]
  activation: sine
training:
  epochs: 50000
  learning_rate: 0.01
