# Control for the legacy Rabi-loss experiments: JC data (g1 = 1, g2 = 0) at ωc = ωa = 5
# (g/ω = 0.2), field dimension 6.
# Here Rabi and JC data differ by ~1.6e-2 on average (vs ~4e-5 at ω = 100), above the
# PINN's data-loss floor, so g2 is identifiable. Otherwise their settings.
# Softplus, ODE loss averaged over components, lr 1e-3 (docs/studies/coherent_squeeze.md):
# with the legacy settings both seeds of control_*_w5 and control_*_w5_softplus fail.
experiment:
  name: control_jc_data_w5_recipe
  description: Identifiable control, learn g1 and g2 from JC data (g1 = 1, g2 = 0) at ω = 5, softplus positivity.
  seeds: [100, 101]
physics:
  picture: rabi2_ip
  params: {wc: 5.0, wa: 5.0, g1: 1.0, g2: 0.0}
  init_state: fock
  dims: {atom: 2, field: 6}
  positivity: softplus
data:
  tfinal: 6.283185307179586  # 2π
  n_time_steps: 500
  n_data_points: 500
model:
  hidden_units: [100, 100, 100]
  activation: sine
training:
  epochs: 50000
  learning_rate: 0.001
  ode_reduction: mean
