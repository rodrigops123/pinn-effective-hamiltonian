# Legacy JC experiment (coherent state): JC data, JC ODE loss, from
# |g> ⊗ |α = 1>, field dimension 10, 1000 time samples of which 500 enter the data loss.
# Legacy settings: field truncation, ODE sum.
experiment:
  name: legacy_jc_coherent
  description: Legacy settings, learn g1 and the state from a coherent field (α = 1).
  seeds: [42, 43]
physics:
  picture: interaction
  params: {wc: 100.0, wa: 100.0, g1: 1.0}
  init_state: coherent
  init_state_options: {alpha: 1.0}
  dims: {atom: 2, field: 10}
  positivity: abs
data:
  tfinal: 6.283185307179586  # 2π
  n_time_steps: 1000
  n_data_points: 500
model:
  hidden_units: [50, 50, 50]
  activation: sine
training:
  epochs: 50000
  learning_rate: 0.001
