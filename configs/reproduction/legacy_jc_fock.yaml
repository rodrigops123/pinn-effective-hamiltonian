# Legacy JC experiment (Fock state): JC data, JC ODE loss, from |e,0>.
# Legacy settings throughout: field truncation, ODE loss summed over components.
experiment:
  name: legacy_jc_fock
  description: Legacy settings, learn g1 and the state from |e,0>, interaction picture.
  seeds: [42, 43]
physics:
  picture: interaction
  params: {wc: 100.0, wa: 100.0, g1: 1.0}
  init_state: fock
  dims: {atom: 2, field: 2}
  positivity: abs
data:
  tfinal: 6.283185307179586  # 2π
  n_time_steps: 200
  n_data_points: 200
model:
  hidden_units: [50, 50, 50]
  activation: sine
training:
  epochs: 30000
  learning_rate: 0.001
